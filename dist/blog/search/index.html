  // Parse the search data
  const searchData = JSON.parse(searchDataJson);
  
  const input = document.getElementById('search-input');
  const resultsDiv = document.getElementById('search-results');
  const statsDiv = document.getElementById('search-stats');
  
  function search(query) {
    if (!query.trim()) {
      resultsDiv.innerHTML = `<p class="placeholder">Type to search ${searchData.length} articles...</p>`;
      statsDiv.textContent = '';
      return;
    }
    
    const q = query.toLowerCase().trim();
    const matches = searchData.filter(item => 
      item.searchText.includes(q) ||
      item.title.toLowerCase().includes(q) ||
      item.tags.some(t => t.toLowerCase().includes(q))
    );
    
    statsDiv.textContent = `${matches.length} result${matches.length !== 1 ? 's' : ''} for "${query}"`;
    
    if (matches.length === 0) {
      resultsDiv.innerHTML = '<p class="no-results">No results found.</p>';
      return;
    }
    
    resultsDiv.innerHTML = matches.map(item => `
      <article class="result-card">
        <a href="/blog/${item.slug}/">
          <h3>${highlight(item.title, q)}</h3>
          <p>${item.description}</p>
          <div class="meta">
            <time>${item.dateFormatted}</time>
            ${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
          </div>
        </a>
      </article>
    `).join('');
  }
  
  function highlight(text, query) {
    const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }
  
  function escapeRegex(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  
  // Input handler with debounce
  let timer;
  input.addEventListener('input', (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => search(e.target.value), 100);
  });
  
  // Tag buttons
  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      input.value = tag;
      search(tag);
    });
  });
  
  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
    }
  });
  
  // Check for URL query parameter
  const urlParams = new URLSearchParams(window.location.search);
  const initialQuery = urlParams.get('q') || '';
  
  // If there's an initial query, run search immediately
  if (initialQuery) {
    input.value = initialQuery;
    search(initialQuery);
  }
  
  // Focus on load (but not if we have a query, to not steal focus)
  if (!initialQuery) {
    input.focus();
  }
})();</script>
